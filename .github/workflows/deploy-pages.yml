name: Publicar RigRadar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  # Recolha diária (schedule/manual). Tem um grupo de concorrência próprio: no GitHub, um
  # novo run pendente cancela o pendente anterior do mesmo grupo, por isso partilhar o grupo
  # do deploy deixava um push humano cancelar a recolha do dia.
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: rigradar-collect
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar backend, lógica do frontend e workflow
        run: node --test "server/*.test.mjs" "test/*.test.mjs"
      - name: Recolher preços autorizados e gerar snapshot
        id: collect
        env:
          RIGRADAR_SOURCES_JSON: ${{ secrets.RIGRADAR_SOURCES_JSON }}
          RIGRADAR_CONTACT: ${{ vars.RIGRADAR_CONTACT }}
          KUANTOKUSTA_FEED_TOKEN: ${{ secrets.KUANTOKUSTA_FEED_TOKEN }}
          IDEALO_FEED_TOKEN: ${{ secrets.IDEALO_FEED_TOKEN }}
        run: node server/collect-prices.mjs
      # Guarda os ficheiros desta recolha ANTES de tentar gravá-los em main: se o push
      # falhar, as leituras do dia continuam recuperáveis (o runner é descartado no fim).
      # Só existe artefacto quando a recolha terminou com sucesso; se os testes ou a
      # recolha falharem, não se publica uma cópia dos ficheiros antigos do checkout que
      # pudesse ser confundida com uma recolha. recolha.json identifica a origem.
      - name: Descrever a recolha
        id: meta
        run: |
          node -e "
            const s = require('./dist/prices.json');
            const meta = { estado:'recolha concluída', generatedAt:s.generatedAt, runId:'${{ github.run_id }}', runAttempt:'${{ github.run_attempt }}', baseCommit:'${{ github.sha }}', fontesAtivas:(s.sources||[]).filter(x => x.status !== 'não configurada').length, pecasComPrecoAtual:(s.components||[]).filter(c => c.status === 'atual').length };
            require('fs').writeFileSync('recolha.json', JSON.stringify(meta, null, 2) + '\n');
            console.log(JSON.stringify(meta));"
      - name: Guardar cópia da recolha como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: recolha-concluida-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recolha.json
            data/prices.sqlite
            dist/prices.json
          retention-days: 30
          if-no-files-found: error
      - name: Gravar histórico e snapshot em main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/commit-snapshot.sh

  # Deploy no Pages. Faz checkout do main mais recente (não do commit que disparou o run),
  # para incluir o commit de dados do bot; pushes feitos com GITHUB_TOKEN não disparam
  # novos runs. Os deploys são serializados; cada um publica o main do seu momento.
  deploy:
    needs: collect
    if: ${{ !cancelled() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar backend, lógica do frontend e workflow
        run: node --test "server/*.test.mjs" "test/*.test.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
